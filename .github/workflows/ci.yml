name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Los *_templ.go e islands_gen.go estan commiteados, asi que el repo
      # compila sin instalar templ ni el CLI.
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
